name: Release deploy

# Publishing a release is what ships. The tag names the image, and that same
# image is what staging verifies and what production promotes later. Nothing
# is rebuilt on the way to production.
on:
  release:
    types: [published]

concurrency:
  group: release-deploy-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ github.event.release.tag_name }}
      # Build the tag, not the branch. main may have moved on already.
      ref: ${{ github.event.release.tag_name }}
      latest: true

  staging:
    name: staging
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      service: k8s-cicd
      environment: staging
      image: ${{ needs.build.outputs.image }}
    secrets: inherit

  promote:
    name: how to promote
    needs: [build, staging]
    runs-on: ubuntu-latest
    steps:
      - name: Print the promotion command
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "::notice title=On staging::$TAG is on staging, promote it when you are ready"

          {
            echo "## \`$TAG\` is on staging"
            echo
            echo "Production ships this exact image, with no rebuild:"
            echo
            echo '```bash'
            echo "gh workflow run deploy.yml \\"
            echo "  -f service=k8s-cicd \\"
            echo "  -f environment=production \\"
            echo "  -f image=$IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
