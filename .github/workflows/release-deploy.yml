name: Release deploy

# Publishing a release is what ships. The tag names the image, and that same
# image is what staging verifies and what production promotes later. Nothing
# is rebuilt on the way to production.
on:
  release:
    types: [published]

concurrency:
  group: release-deploy-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: build and push the release image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      # The tag, not the branch. main may have moved on already.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Work out the image reference
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # GHCR will not take uppercase in a repository path.
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          registry="ghcr.io/$repo"

          {
            echo "registry=$registry"
            echo "image=$registry:$TAG"
          } >> "$GITHUB_OUTPUT"

          echo "::notice title=Release image::$registry:$TAG"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.registry }}:latest
          # Ties the package to this repo in the GitHub UI.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "::group::Pushed"
          echo "$IMAGE"
          echo "${{ steps.meta.outputs.registry }}:latest"
          echo "::endgroup::"

          {
            echo "## Released \`$TAG\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Also tagged | \`latest\` |"
            echo "| Next | staging |"
            echo
            echo "### Promote to production"
            echo
            echo "Ships the image staging already verified, with no rebuild:"
            echo
            echo '```bash'
            echo "gh workflow run deploy.yml \\"
            echo "  -f service=k8s-cicd \\"
            echo "  -f environment=production \\"
            echo "  -f image=$IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: staging
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      service: k8s-cicd
      environment: staging
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
