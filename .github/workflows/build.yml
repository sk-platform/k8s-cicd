name: Build

# Builds the image and pushes it to GHCR under the tag it is given. This is the
# only place an image gets built, so a release and a dev deploy produce them
# the same way.
#
# Callers pass the tag. They decide what a tag means: a release passes its
# version, a dev deploy passes the commit SHA.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to push the image under
        required: true
        type: string
      ref:
        description: Commit, branch or tag to build from. Defaults to whatever triggered the run.
        required: false
        type: string
        default: ""
      latest:
        description: Also push this image as :latest
        required: false
        type: boolean
        default: false
    outputs:
      image:
        description: Full reference of the image that was pushed
        value: ${{ jobs.build.outputs.image }}

  # Useful on its own for rebuilding a tag without deploying it.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to push the image under
        required: true
        type: string
      ref:
        description: Commit, branch or tag to build from
        required: false
        type: string
      latest:
        description: Also push this image as :latest
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      # An empty ref checks out whatever triggered the run.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Work out the image reference
        id: meta
        env:
          TAG: ${{ inputs.tag }}
          LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail

          # GHCR will not take uppercase in a repository path.
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          registry="ghcr.io/$repo"

          {
            echo "registry=$registry"
            echo "image=$registry:$TAG"
          } >> "$GITHUB_OUTPUT"

          # Built here rather than with an inline conditional, so the list
          # never ends up with a blank line in it.
          {
            echo "tags<<TAGS_EOF"
            echo "$registry:$TAG"
            if [ "$LATEST" = "true" ]; then
              echo "$registry:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "::notice title=Building::$registry:$TAG"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Ties the package to this repo in the GitHub UI.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          REGISTRY: ${{ steps.meta.outputs.registry }}
          LATEST: ${{ inputs.latest }}
          BUILT_FROM: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail

          echo "::group::Pushed"
          echo "$IMAGE"
          if [ "$LATEST" = "true" ]; then
            echo "$REGISTRY:latest"
          fi
          echo "::endgroup::"

          {
            echo "## Built \`$IMAGE\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Built from | \`$BUILT_FROM\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            if [ "$LATEST" = "true" ]; then
              echo "| Also tagged | \`latest\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
