name: Build and deploy

# Manual deploy of whatever branch you run it from into one of the dev
# namespaces. Tagged with the short SHA, so re-running on the same commit
# pushes over the same tag.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target dev namespace
        type: choice
        options:
          - dev0
          - dev1
          - dev2
          - dev3
        required: true

concurrency:
  group: build-and-deploy-${{ inputs.environment }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out the image reference
        id: meta
        run: |
          set -euo pipefail

          # GHCR will not take uppercase in a repository path.
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tag="$(git rev-parse --short HEAD)"

          echo "image=ghcr.io/$repo:$tag" >> "$GITHUB_OUTPUT"
          echo "::notice title=Image::ghcr.io/$repo:$tag"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TARGET: ${{ inputs.environment }}
        run: |
          {
            echo "## Built for \`$TARGET\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Branch | \`$GITHUB_REF_NAME\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Image | \`$IMAGE\` |"
            echo
            echo "Dev images are not promoted. Staging and production only run"
            echo "images built from a published release."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: ${{ inputs.environment }}
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      service: k8s-cicd
      environment: ${{ inputs.environment }}
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
