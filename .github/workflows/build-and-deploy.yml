name: Build and deploy

# Manual deploy of whatever branch you run it from, into one of the dev
# namespaces.
#
# It works out a tag, hands it to build.yml, then hands the image build.yml
# produced to deploy.yml. Neither of those knows about the other.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target dev namespace
        type: choice
        options:
          - dev0
          - dev1
          - dev2
          - dev3
        required: true
      version:
        description: Tag the image with this version. Leave blank to tag with the short commit SHA.
        type: string
        required: false

concurrency:
  group: build-and-deploy-${{ inputs.environment }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tag:
    name: work out the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Pick the tag
        id: pick
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # A version if you gave one, otherwise the commit. Dev tags are
          # disposable, so re-running on the same commit pushes over the same
          # tag rather than piling up new ones.
          if [ -n "$VERSION" ]; then
            tag="$VERSION"
            source="version input"
          else
            tag="${GITHUB_SHA:0:7}"
            source="commit SHA"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice title=Tag::$tag, from the $source"

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.tag.outputs.tag }}

  deploy:
    name: ${{ inputs.environment }}
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      service: k8s-cicd
      environment: ${{ inputs.environment }}
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
